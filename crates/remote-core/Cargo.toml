[package]
name = "aionix-remote-core"
description = "Remote session engine: session state machine, authorization, approval, host/technician coordinators, adaptive quality"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# DEVELOPMENT ONLY: in-process session authority issuing tickets without real
# authorization (session::dev_authority). Never enable in product builds.
dev-authority = []

[dependencies]
aionix-brand = { workspace = true }
aionix-shared = { workspace = true }
aionix-crypto = { workspace = true }
aionix-control-api = { workspace = true }
aionix-protocol = { workspace = true }
aionix-transport = { workspace = true }
aionix-input = { workspace = true }
aionix-platform = { workspace = true }
async-trait = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
aionix-capture = { workspace = true }
aionix-codec = { workspace = true }

[dev-dependencies]
# Tests and examples use the development authority.
aionix-remote-core = { path = ".", features = ["dev-authority"] }
iroh-relay = { workspace = true, features = ["server"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
