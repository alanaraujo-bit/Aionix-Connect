[package]
name = "aionix-client"
description = "Control Plane client for devices and technicians: enrollment, device login, signaling with reconnect, production AuthorizationProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aionix-shared = { workspace = true }
aionix-crypto = { workspace = true }
aionix-control-api = { workspace = true }
aionix-remote-core = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
aionix-platform = { workspace = true }

[dev-dependencies]
aionix-control-plane = { workspace = true, features = ["test-support"] }
aionix-signaling = { workspace = true }
aionix-server-common = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
tracing-subscriber = { workspace = true }
